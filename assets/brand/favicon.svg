  <polygon points="24,8 33.9,18.2 24,18.2" fill="#c98a26" opacity=".6" />
  <rect x="16.3" y="19.8" width="15.4" height="2.4" fill="#8f8572" opacity=".55" />
  <!-- 본관 띠 장식 -->
