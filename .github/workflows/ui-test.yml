name: UI test

# 화면에 영향을 주는 파일이 바뀐 경우에만 브라우저 테스트를 실행합니다.
on:
  pull_request:
    branches: [dev]
    paths:
      - src/**
      - server/**
      - api/**
      - assets/**
      - e2e/**
      - index.html
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - playwright.config.ts
      - .github/workflows/ui-test.yml
  push:
    branches: [dev]
    paths:
      - src/**
      - server/**
      - api/**
      - assets/**
      - e2e/**
      - index.html
      - package.json
      - package-lock.json
      - tsconfig.json
      - vite.config.ts
      - playwright.config.ts
      - .github/workflows/ui-test.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-test:
    name: UI test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: ui-test-results
          path: test-results/
          retention-days: 7
