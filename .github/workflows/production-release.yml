name: Production release

on:
  repository_dispatch:
    types: [vercel.deployment.success]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.sender.login == 'vercel[bot]' &&
      github.event.client_payload.project.id == 'prj_37j31S7uKMYN4GZuhHrVJoqAkqy0' &&
      github.event.client_payload.environment == 'production' &&
      github.event.client_payload.git.ref == 'main'
    runs-on: ubuntu-latest
    concurrency:
      group: agentopia-production-release
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record deployed commit and retain the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_SHA: ${{ github.event.client_payload.git.sha }}
        run: python3 .github/scripts/production-release.py
