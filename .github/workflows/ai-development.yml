name: AI development
run-name: 'AI development for Issue #${{ github.event.issue.number || inputs.issue }}'

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: '재개할 이슈 번호'
        required: true
        type: number
      development_note:
        description: '수동 개발 재개 시 확인할 소스·테스트 위치와 판단 근거 (선택)'
        required: false
        type: string
      review_note:
        description: '수동 재개 시 리뷰어가 재확인할 오류와 재현 조건 (선택)'
        required: false
        type: string
      recovery_run:
        description: '완료 단계가 재개할 검토 실행 번호'
        required: false
        type: string

      ci_feedback:
        description: '완료 단계에서 확인한 현재 HEAD의 CI 오류'
        required: false
        type: string

      ci_attempt:
        description: '자동 수정 대상 CI 실행 번호/시도 번호'
        required: false
        type: string

      ci_blocker:
        description: '자동 수정 위치를 확인하지 못한 CI 검사와 실행 링크'
        required: false
        type: string

permissions: {}

jobs:
  develop:
    if: >-
      github.repository == 'han41858/agentopia' &&
      github.ref == 'refs/heads/dev' &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'ai:develop' || github.event.label.name == 'ai:develop:claude')
    concurrency:
      group: ai-development-issue-${{ github.event.issue.number || inputs.issue }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ai-development
    permissions:
      contents: read
      actions: read # Verify the Environment deployment branch policy.
      issues: write
      pull-requests: write # Post the review comment on the draft PR.
    outputs:
      ready: ${{ steps.review.outputs.ready }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the AI environment branch policy
        run: bash .github/scripts/check-ai-environment.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - name: Develop and review a draft PR
        id: review
        run: node .github/scripts/ai-development/run.mjs
        env:
          AI_ISSUE: ${{ github.event.issue.number || inputs.issue }}
          GH_TOKEN: ${{ github.token }}
          AI_AUTOMATION_TOKEN: ${{ secrets.AI_AUTOMATION_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_CODEX_MODEL: ${{ vars.AI_CODEX_MODEL }}
          AI_CLAUDE_MODEL: ${{ vars.AI_CLAUDE_MODEL }}
      - name: Sync PR progress from the latest issue journal
        if: ${{ !cancelled() && steps.review.outcome != 'skipped' }}
        continue-on-error: true
        run: python3 .github/scripts/progress-sync.py
        env:
          GH_TOKEN: ${{ github.token }}
          AI_ISSUE: ${{ github.event.issue.number || inputs.issue }}

  handoff:
    needs: develop
    if: needs.develop.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Check CI for the reviewed run
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: gh workflow run ai-completion.yml --repo "$GITHUB_REPOSITORY" --ref dev -f "issue=$ISSUE" -f "review_run=$GITHUB_RUN_ID"
