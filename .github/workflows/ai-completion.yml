name: AI completion

on:
  workflow_call:
    secrets:
      AI_AUTOMATION_TOKEN:
        required: true
    inputs:
      issue:
        required: true
        type: number
      review_run:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      issue:
        description: '완료 단계를 재개할 이슈 번호'
        required: true
        type: number
      review_run:
        description: '검토를 완료한 개발 실행 번호'
        required: false
        type: string

permissions: {}

jobs:
  complete:
    if: >-
      github.repository == 'han41858/agentopia' &&
      github.ref == 'refs/heads/dev'
    concurrency:
      group: >-
        ai-development-issue-${{ inputs.issue }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ai-development
    permissions:
      contents: read
      actions: write # Dispatch development when the reviewed base advances.
      checks: read # Read source annotations from the failed CI attempt.
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify the AI environment branch policy
        run: bash .github/scripts/check-ai-environment.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Merge reviewed PR and close issue
        id: completion
        run: |
          if [[ -z "$AI_AUTOMATION_TOKEN" ]]; then
            echo "::error::ai-development 환경의 완료 게시 토큰을 확인하세요."
            exit 1
          fi
          python3 .github/scripts/ai-completion.py
        env:
          GH_TOKEN: ${{ github.token }}
          AI_AUTOMATION_TOKEN: ${{ secrets.AI_AUTOMATION_TOKEN }}
          AI_REVIEW_RUN: ${{ inputs.review_run }}
          AI_ISSUE: ${{ inputs.issue }}
      - name: Sync PR progress from the latest issue journal
        if: ${{ !cancelled() && steps.completion.outcome != 'skipped' }}
        continue-on-error: true
        run: python3 .github/scripts/progress-sync.py
        env:
          GH_TOKEN: ${{ github.token }}
          AI_ISSUE: ${{ inputs.issue }}
      - name: Reconcile parent after confirmed child closure
        if: steps.completion.outputs.child_closed == 'true'
        run: gh workflow run parent-completion.yml --ref dev -f mode=child -f issue="$AI_ISSUE"
        env:
          GH_TOKEN: ${{ github.token }}
          AI_ISSUE: ${{ inputs.issue }}
